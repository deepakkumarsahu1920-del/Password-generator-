<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Password Generator</h1>
        <p class="subtitle">Create a strong and secure password</p>

        <div class="password-box">
            <input type="text" id="password" readonly placeholder="Your password">
            <button id="copyBtn">Copy</button>
        </div>

        <div class="settings">
            <label for="length">Password Length:</label>

            <div class="length-control">
                <input type="number" id="length" min="4" max="50" value="12">
                <input type="range" id="lengthRange" min="4" max="50" value="12">
            </div>

            <label class="option">
                <input type="checkbox" id="uppercase" checked>
                Uppercase Letters (A-Z)
            </label>

            <label class="option">
                <input type="checkbox" id="lowercase" checked>
                Lowercase Letters (a-z)
            </label>

            <label class="option">
                <input type="checkbox" id="numbers" checked>
                Numbers (0-9)
            </label>

            <label class="option">
                <input type="checkbox" id="special" checked>
                Special Characters (!@#$%)
            </label>
        </div>

        <p id="message"></p>

        <button id="generateBtn" class="generate">
            Generate Password
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
